name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Ruby tests
        run: bundle exec ruby bin/test
      - name: JavaScript tests
        run: npm test
      - name: RuboCop
        run: bundle exec rubocop
      - name: Build gem
        run: gem build active_webmcp.gemspec
